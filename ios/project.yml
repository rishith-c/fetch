name: FetchCheckpoint
options:
  bundleIdPrefix: com.rishith.fetch
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  FetchCheckpoint:
    type: application
    platform: iOS
    sources:
      - path: FetchCheckpoint.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishith.fetch.checkpoint
        PRODUCT_NAME: FETCH
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: FetchCheckpoint-Info.plist
      properties:
        CFBundleDisplayName: FETCH
        UILaunchScreen: {}
        NSCameraUsageDescription: FETCH uses the camera to scan the checkpoint QR code nearest you.
        NSLocalNetworkUsageDescription: FETCH connects to the nearby robot on your private demo network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
